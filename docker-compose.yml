services:
  dashboard:
    build: .
    image: urlscan-dashboard:latest
    container_name: urlscan-dashboard
    restart: unless-stopped
    # Publish on loopback only and terminate TLS in a reverse proxy in front.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      TRUST_PROXY: "true"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
